name: bb-frontend

services:
    app:
        # Debian, nicht Alpine: node_modules wird mit dem Host geteilt, damit
        # ESLint/Volar/vitest dort weiterlaufen. Native Binaries (esbuild,
        # rollup, sass-embedded) passen nur, solange beide Seiten glibc und
        # dieselbe Node-Major benutzen.
        image: node:22-bookworm-slim
        container_name: bb-frontend-app
        working_dir: /app
        # Host-UID/GID, damit node_modules/.nuxt auf dem Host schreibbar bleiben
        user: '${WWWUSER:-1000}:${WWWGROUP:-1001}'
        # npm ci nur beim ersten Start; danach direkt der Dev-Server
        command: sh -c '[ -d node_modules ] || npm ci --no-audit --no-fund; exec npm run dev'
        environment:
            HOME: /home/node # uid 1000 -> schreibbar, npm-Cache landet hier
            HOST: 0.0.0.0
            # Innen derselbe Port wie außen, sonst zeigt der HMR-Client ins Leere
            PORT: '${APP_PORT:-3021}'
            NUXT_TELEMETRY_DISABLED: '1'
        # Loopback only: ohne das explizite 127.0.0.1 published Docker auf
        # 0.0.0.0 und umgeht jeden Filter auf Host-Ebene.
        ports:
            - '127.0.0.1:${APP_PORT:-3021}:${APP_PORT:-3021}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/app'
        # SSR laeuft im Container und muss das Backend erreichen. Ueber den
        # Host-Gateway geht das nicht, weil bb-backend seine Ports nur auf
        # 127.0.0.1 published — also direkt ins Backend-Netz haengen und den
        # Container ansprechen (NUXT_API_BASE_INTERNAL).
        networks:
            - default
            - bb-backend
        stdin_open: true
        tty: true

networks:
    # Wird von bb-backend/docker-compose.yml angelegt; das Backend muss laufen.
    bb-backend:
        external: true
        name: bb-backend_bb-backend
